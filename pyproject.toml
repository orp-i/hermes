[project]
name = "hermes-portal"
version = "0.2.0"
description = "Lightweight portal + multi-model agent with persistent docker sandbox."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.9,<1",
  "httpx>=0.28,<1",
  "pyyaml>=6.0,<7",
  "openai>=1.55,<2",
  "ddgs>=9.0,<10",
  "python-docx>=1.1,<2",
  "reportlab>=4.2,<5",
  "pymupdf>=1.24,<2",
]

[tool.uvicorn]
factory = false
